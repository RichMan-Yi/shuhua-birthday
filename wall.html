<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舒華生日祝福牆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
  /* Layout: the game's 3D island fills the screen; handwritten notes pop out of it. A small title note
     sits top-left, and the ranking lives in a notebook drawer behind one button. */
  :root {
    --sky: #141B3A;
    --ink: #22343A;
    --muted: #5C6F74;
    --paper: #FFFBF3;
    --line: #E8DDCB;
    --peach: #E8685C;
    --peach-deep: #C84B40;
    --gold: #D9A021;
    --rule: #CFE1EA;
    --margin: #F2B7AE;
    --scrim: rgba(34, 52, 58, 0.32);
    /* handwriting: Latin in Caveat, Hangul in Nanum Pen, Chinese and kana in LXGW WenKai */
    --font-hand: "Caveat", "Nanum Pen Script", "LXGW WenKai TC", "Klee One", cursive;
    --font-hand-zh: "LXGW WenKai TC", "Nanum Pen Script", "Klee One", cursive;
    --font-display: "Huninn", "PingFang TC", "Noto Sans TC", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* notes that pop out of the island */
  #strings { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #notes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .note {
    position: absolute;
    left: 0;
    top: 0;
    max-width: 13em;
    padding: 0.6em 0.8em 0.5em;
    background: var(--paper-c, #FFFDF5);
    color: var(--ink-c, #2B4C7E);
    /* the classic wobbly hand-drawn border */
    border: 2px solid color-mix(in srgb, var(--ink-c, #2B4C7E) 55%, transparent);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    box-shadow: 2px 4px 0 rgba(34, 52, 58, 0.12), 0 10px 24px rgba(34, 52, 58, 0.14);
    font-family: var(--font-hand);
    font-size: var(--size, 18px);
    line-height: 1.25;
    transform-origin: 50% 100%;
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
  }
  .note .tape {
    position: absolute;
    top: -0.55em;
    left: 50%;
    width: 3.2em;
    height: 1.05em;
    transform: translateX(-50%) rotate(var(--tape, -4deg));
    background: var(--tape-c, rgba(232, 104, 92, 0.35));
    border-left: 2px dotted rgba(255, 255, 255, 0.7);
    border-right: 2px dotted rgba(255, 255, 255, 0.7);
  }
  .note .wish { margin: 0; font-family: var(--font-hand-zh); font-weight: 400; overflow-wrap: anywhere; }
  .note .wish:lang(en) { font-family: var(--font-hand); font-size: 1.25em; }
  .note .sign { display: block; margin-top: 0.25em; font-size: 0.78em; opacity: 0.85; white-space: nowrap; }
  .note .sign b { font-family: "Caveat", cursive; font-size: 1.3em; font-weight: 700; }
  .note .pts { position: absolute; right: -0.9em; bottom: -0.8em; font-family: "Caveat", cursive; font-weight: 700; font-size: 0.85em; color: var(--peach-deep); background: #FFFFFF; border: 1.5px solid currentColor; border-radius: 60% 45% 55% 50%; padding: 0.05em 0.45em; transform: rotate(-8deg); }
  .note.top10 { --tape-c: rgba(217, 160, 33, 0.55); }
  .note.mine { outline: 3px dashed var(--peach); outline-offset: 5px; }
  .note .badge { position: absolute; left: -1.1em; top: -1.1em; font-family: "Caveat", "LXGW WenKai TC", cursive; font-weight: 700; font-size: 0.9em; color: #FFFFFF; background: var(--peach); border-radius: 50%; width: 2.2em; height: 2.2em; display: grid; place-items: center; transform: rotate(-12deg); box-shadow: 0 2px 0 var(--peach-deep); }
  .note.podium { padding-top: 1em; }
  .note.podium .wish { font-weight: 700; }
  .note .doodle { position: absolute; left: 50%; top: -2.4em; width: 3.4em; height: 2.6em; transform: translateX(-50%) rotate(-6deg); overflow: visible; }
  .puff { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px dotted rgba(255, 236, 170, 0.95); pointer-events: none; animation: puff 0.7s ease-out forwards; }

  /* title note and controls */
  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(20em, calc(100% - 32px));
    padding: 12px 16px 10px;
    background: #FFFDF5;
    border: 2px solid rgba(34, 52, 58, 0.35);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    transform: rotate(-1.5deg);
    box-shadow: 2px 4px 0 rgba(34, 52, 58, 0.1);
    font-family: var(--font-hand-zh);
    z-index: 3;
  }
  .title small { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.12em; color: var(--peach-deep); }
  .title h1 { margin: 2px 0 2px; font-weight: 700; font-size: 26px; line-height: 1.15; }
  .title p { margin: 0; font-size: 15px; color: var(--muted); }
  .title .sim { display: inline-block; margin-top: 6px; font-family: var(--font-body); font-size: 11px; color: var(--ink); background: #FFF1C9; border-radius: 999px; padding: 2px 8px; transform: rotate(1.5deg); }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    z-index: 3;
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    font-family: var(--font-display);
    font-size: 16px;
    border: 0;
    border-radius: 999px;
    padding: 10px 20px;
    background: var(--peach);
    color: #FFFFFF;
    box-shadow: 0 3px 0 var(--peach-deep);
    cursor: pointer;
    text-decoration: none;
  }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* notebook drawer for ranking and search */
  .drawer { position: fixed; inset: 0; z-index: 4; display: grid; place-items: end center; background: var(--scrim); }
  .book {
    width: min(560px, 100%);
    max-height: min(86%, 760px);
    overflow-y: auto;
    padding-block: 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: #FFFDF5 repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -10px 30px rgba(34, 52, 58, 0.2);
    position: relative;
    display: grid;
    gap: 14px;
    animation: up 0.3s ease-out;
  }
  .book::before { content: ""; position: absolute; top: 0; bottom: 0; left: 42px; border-left: 2px solid var(--margin); opacity: 0.6; pointer-events: none; }
  .book > * { position: relative; }
  .book header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .book h2 { margin: 0; font-family: var(--font-hand-zh); font-weight: 700; font-size: 26px; padding-left: 40px; }
  .book .close { border: 0; background: none; font-size: 28px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 8px; }
  .book .me { margin: 0 0 0 40px; padding: 8px 12px; border: 2px dashed var(--peach); border-radius: 12px; background: #FFF4EF; font-family: var(--font-hand-zh); font-size: 18px; }
  .book input { margin-left: 40px; width: calc(100% - 40px); border: 0; border-bottom: 2px solid var(--ink); background: transparent; padding: 6px 2px; font: 20px var(--font-hand-zh); color: var(--ink); }
  .book input:focus { outline: none; border-bottom-color: var(--peach); }
  .list { list-style: none; margin: 0; padding: 0 0 0 40px; display: grid; }
  .list li { display: grid; grid-template-columns: 3.4em minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 8px; align-items: baseline; min-height: 32px; font-family: var(--font-hand-zh); font-size: 17px; }
  .list li.mine { color: var(--peach-deep); font-weight: 700; }
  .list .r { font-family: "Caveat", cursive; font-size: 20px; color: var(--muted); }
  .list li.podium .r { color: var(--gold); font-weight: 700; }
  .list .n { font-family: "Caveat", var(--font-hand-zh); font-size: 21px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .w { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .s { font-family: "Caveat", cursive; font-weight: 700; font-size: 20px; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding-left: 40px; font-family: "Caveat", cursive; font-size: 20px; }
  .hint { margin: 0 0 0 40px; font-family: var(--font-hand-zh); font-size: 16px; color: var(--muted); }

  @keyframes puff { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  @media (max-width: 600px) {
    .title h1 { font-size: 22px; }
    .note { max-width: 11em; }
    .list li { grid-template-columns: 3em minmax(0, 1fr) auto; }
    .list .w { display: none; }
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<canvas id="stage" aria-label="桃園 3D 地圖"></canvas>
<svg id="strings" aria-hidden="true"></svg>
<div id="notes" aria-live="off"></div>

<header class="title">
  <small>1.6 舒華生日企劃</small>
  <h1>給舒華的生日祝福</h1>
  <p><span id="count">0</span> 則祝福從桃園各地冒出來</p>
  <span class="sim">模擬畫面・名單和祝福都是測試資料</span>
</header>

<nav class="dock">
  <button id="openBook" class="btn">排行榜・找我的祝福</button>
  <a class="btn ghost" href="index.html">回到遊戲</a>
</nav>

<div id="drawer" class="drawer" hidden>
  <section class="book" aria-label="排行榜">
    <header>
      <h2>排行榜</h2>
      <button id="closeBook" class="close" aria-label="關閉">×</button>
    </header>
    <p id="meLine" class="me" hidden></p>
    <input id="q" type="search" placeholder="寫下名字找找看⋯" autocomplete="off" spellcheck="false" aria-label="搜尋名字">
    <p id="hint" class="hint">點任何一則，它就會在地圖上冒出來。</p>
    <ul id="list" class="list"></ul>
    <div class="pager">
      <button id="prev" class="btn ghost">上一頁</button>
      <span id="page"></span>
      <button id="next" class="btn ghost">下一頁</button>
    </div>
  </section>
</div>

<script type="module" src="src/wall.js"></script>
</body>
</html>
